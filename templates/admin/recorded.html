{% extends "base.html"%}

{%block body%}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">recorded</h2>
            <a href="/admin/recorded/add" class="btn-admin outline-btn">
                <i class="fa-solid fa-plus"></i>
                Add course
            </a>
        </div>
        <div class="course-grid">
            {% for recorded in recorded%}
            <div class="course-card">
           <div class="course-card-header">
              <i class="fa-solid fa-book"></i>
              <h3>{{recorded.title}}</h3>
           </div>
           <p>{{recorded.description}}</p>
           <p>{{recorded.price}}</p>
           <div class="course-actions">
            <a href="{{ url_for('recorded.edit_course', id=recorded.id)}}"class="action-btn edit-btn">
                <i class="fa-solid fa-pen"></i>
            </a>
            <a href="{{ url_for('recorded.delete_course', id=recorded.id)}}" class="action-btn delete-btn">
                <i class="fa-solid fa-trash"></i>
            </a>
            <a href="{{ url_for('recorded.lessons', id=recorded.id)}}" class="btn">
                <i class="fa-solid fa-book"></i>
                Mange Lessons
            </a>
           </div>
       </div>
     {%endfor%}
</div>
         
{%endblock%}
